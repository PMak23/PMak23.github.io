<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b26">
<title>What's On</title>
<style>
  :root{
    --bg:#151b26; --panel:#1d2532; --line:#2a3444;
    --ink:#f2f4f7; --ink-2:#aab3c2; --ink-3:#6d778a;
    --hot:#ff4d3d; --warm:#ff9a2e; --mild:#e8c547; --cool:#5c6b82;
    --chip:#243042; --chip-on:#f2f4f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:18px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
  #updated{font-size:12px;color:var(--ink-3)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;
    background:var(--chip);color:var(--ink-2);cursor:pointer}
  .chip.on{background:var(--chip-on);color:var(--bg)}
  .chip:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
  h2{margin:14px 16px 6px;font-size:13px;font-weight:600;color:var(--ink-3)}
  h3.day{margin:10px 16px 4px;font-size:12px;font-weight:600;color:var(--ink-3);opacity:.75}
  .game{display:grid;grid-template-columns:74px 1fr;gap:0 12px;align-items:center;
    padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .game:last-child{border-bottom:1px solid var(--line)}
  .rating{font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .rating small{display:block;font-size:11px;font-weight:600;letter-spacing:0;margin-top:4px;color:var(--ink-3)}
  .r-hot{color:var(--hot)} .r-warm{color:var(--warm)} .r-mild{color:var(--mild)} .r-cool{color:var(--cool)}
  .pre .rating{opacity:.85}
  .teams{display:flex;gap:14px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .teams span{white-space:nowrap}
  .teams .lead{color:var(--ink)} .teams .trail{color:var(--ink-2)}
  .teams .rank{font-size:12px;font-weight:600;color:var(--ink-3);margin-right:3px}
  .status{font-size:13px;color:var(--ink-2);margin-top:2px}
  .status b{font-weight:700;color:var(--ink)}
  .nets{margin-top:2px}
  .net-nat{font-size:13px;font-weight:700;color:var(--ink)}
  .net-loc{font-size:12px;color:var(--ink-3)}
  .why{font-size:13px;color:var(--ink-3);margin-top:2px;display:flex;justify-content:space-between;align-items:center}
  .chevron{font-size:10px;color:var(--ink-3);opacity:.6;margin-left:8px}
  .breakdown{display:none;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .game.expanded .breakdown{display:flex}
  .subscore{display:flex;flex-direction:column;gap:2px}
  .subscore span{font-size:11px;color:var(--ink-3)}
  .subscore b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .empty,.err{padding:18px 16px;color:var(--ink-3);font-size:14px}
  .err{color:#ff9a8f}
  footer{padding:20px 16px 28px;font-size:12px;color:var(--ink-3)}
  @media (prefers-reduced-motion:no-preference){.game{transition:background .2s}}
</style>
</head>
<body>
<header>
  <h1>What's On</h1>
  <span id="updated"></span>
</header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<footer>Ratings 1 to 10. Based on how close it is, time left, odds, upsets, playoffs and national TV. Refreshes every 30 seconds.</footer>

<script>
// ---------- TUNING KNOBS: change these numbers to tune the ratings ----------
const W = {
  softCeiling: 8.0,     // below this, ratings work exactly as the rest of this file describes.
  softCeilingSoftness: 2.0, // above softCeiling, HIGHER = harder to reach 10 (needs more stacked raw excitement)
  qualityCapBase: 6.0,  // hard ceiling for the least notable teams (quality01=0) — see quality01 below
  qualityCapRange: 4.0, // qualityCapBase + this = ceiling for the most notable teams (quality01=1) — 6+4=10, uncapped
  stakesFloor: -3.0,    // ctx value that shows as Stakes=0
  stakesRange: 10.0,    // ctx this far above stakesFloor shows as Stakes=10
  liveBase: 2.5,      // every live game starts here
  liveClose: 5.0,     // max points for being close
  // How much closeness counts, at each stage of the game — NOT capped at 1.0x.
  // A tie late matters more than a tie early, and a tie in overtime matters most
  // of all, so this is allowed to exceed "full weight." Smoothly interpolated
  // between these checkpoints, not a hard jump between stages.
  timeStart: 0.7,     // kickoff / 1st inning
  timeMid: 1.0,       // halfway through
  timeLate: 1.3,      // start of the final period / 7th-8th inning
  timeEnd: 1.5,       // end of regulation / final inning
  timeOT: 1.7,         // overtime / extra innings
  wireBonus: 1.0,     // late and within one score
  otBonus: 1.5,       // overtime / extra innings
  upsetBonus: 1.0,    // underdog leading (plus up to +1 more for bigger dogs)
  playoff: 1.5,       // postseason game
  national: 0.5,      // on national TV
  evening: 0.3,       // starts 5 to 9 PM your time
  rankedBoth: 0.7,    // both teams ranked (college)
  top10: 0.3,         // a top-10 team is playing (college)
  top10Showdown: 0.6, // ADDITIONAL, on top of rankedBoth — both teams top-10 specifically
  rankedTrailing: 2.0, // max bonus for a ranked team currently behind — scaled by rank AND how close the game still is
  standings: 2.0,      // max swing from combined record vs .500 (both bad = down, both good = up)
  watchability: 1.5,   // max swing from the WATCHABILITY list below (5=marquee, 1=skip)
  teamWatch: 1.5,      // max swing from TEAM_QUALITY (both teams' brand/power ranking)
  sportInterest: 1.2,  // max swing from each sport's interest baseline (see SPORTS above)
  preBase: 3.0,       // upcoming games start here
  preSpread: 2.5,     // max points for a tight spread
  finalBase: 2.0, finalClose: 4.0, finalOT: 2.0, finalUpset: 1.5, finalContext: 0.7
};

// Sports you can pick. unit = "one score". upset = spread that counts as a real underdog.
// interest = baseline general-audience attention, -1 to 1, applied flat to every
// game in that sport. This is a judgment call, not pulled from any data source —
// tune these numbers freely, they're just a starting point.
const SPORTS = {
  nfl:  {name:'NFL',  path:'football/nfl/scoreboard',                       standingsPath:'football/nfl/standings', unit:8, spreadBased:true, periods:4, len:15, clockDown:true, interest:1.8},
  cfb:  {name:'CFB',  path:'football/college-football/scoreboard?groups=80&limit=100', unit:8, spreadBased:true, periods:4, len:15, clockDown:true, interest:0.6, hasRanking:true},
  mlb:  {name:'MLB',  path:'baseball/mlb/scoreboard',                        standingsPath:'baseball/mlb/standings', unit:1, interest:0.1, innings:9},
  nba:  {name:'NBA',  path:'basketball/nba/scoreboard',                      standingsPath:'basketball/nba/standings', unit:3, spreadBased:true, periods:4, len:12, clockDown:true, interest:0.5},
  nhl:  {name:'NHL',  path:'hockey/nhl/scoreboard',                          standingsPath:'hockey/nhl/standings', unit:1, interest:-0.1, periods:3, len:20, clockDown:true},
  cbb:  {name:'CBB',  path:'basketball/mens-college-basketball/scoreboard?groups=50&limit=100', unit:3, spreadBased:true, interest:0.3, periods:2, len:20, clockDown:true, hasRanking:true},
  wnba: {name:'WNBA', path:'basketball/wnba/scoreboard',                     standingsPath:'basketball/wnba/standings', unit:3, spreadBased:true, interest:-0.3, periods:4, len:10, clockDown:true},
  mls:  {name:'MLS',  path:'soccer/usa.1/scoreboard',                        unit:1, interest:-0.4, periods:2, len:45, clockDown:false},
  epl:  {name:'EPL',  path:'soccer/eng.1/scoreboard',                        unit:1, interest:-0.2, periods:2, len:45, clockDown:false},
};
const DEFAULT_ON = ['nfl','cfb','mlb'];

// Update this by hand once a week from Covers.com's Watchability Ratings
// (search "covers.com [sport] top 25 predictions watchability" for this
// week's page — the URL changes weekly, e.g. .../ncaaf/top-25-predictions-week-3-2026).
// Key = both teams' abbreviations AS SHOWN IN THIS APP, sorted alphabetically,
// joined with a dash, so it doesn't matter who's home/away.
// Scale: 5 = must-watch, 3 = average (no effect), 1 = skip it.
// Only covers games involving a ranked team — leave everything else out.
const WATCHABILITY = {
  'LSU-MISS': 5,    // LSU vs Ole Miss
  'HOU-TTU': 5,     // Houston vs Texas Tech
  'LOU-SMU': 5,     // Louisville vs SMU
  'TXAM-UK': 4,     // Texas A&M vs Kentucky
  'UVA-WVU': 4,     // Virginia vs West Virginia
  'OU-UNM': 3,      // Oklahoma vs New Mexico
  'ALA-FSU': 3,     // Alabama vs Florida State
  'MIA-WAKE': 3,    // Miami vs Wake Forest
  'MSU-ND': 3,      // Michigan State vs Notre Dame
  'RUTG-USC': 2,    // Rutgers vs USC
  'ARK-UGA': 2,     // Arkansas vs Georgia
  'TEX-UTSA': 2,    // Texas vs UTSA
  'BYU-CSU': 2,     // BYU vs Colorado State
  'MIZZ-TROY': 1,   // Missouri vs Troy
  'KENN-TENN': 1,   // Kennesaw State vs Tennessee
  'USU-UTAH': 1,    // Utah State vs Utah
  'BUFF-PSU': 1,    // Buffalo vs Penn State
  'MICH-UTEP': 1,   // Michigan vs UTEP
  'IND-WKU': 1,     // Indiana vs Western Kentucky
  'KENT-OSU': 1,    // Kent State vs Ohio State
  'IOWA-UNI': 1,    // Iowa vs Northern Iowa
  'ORE-PRST': 1,    // Oregon vs Portland State (already played Fri)
};

// Team quality/brand rank per sport, 1 (best/most notable) to N (worst) — lower
// is better. Used for every game in that sport via both teams' average rank.
//   nfl: season-long (source: ESPN/Ben Solak preseason watchability ranking).
//        Rarely needs updating — redo only if a team's play swings hard.
//   mlb: IN-SEASON POWER RANKING — this one moves. Update every 1-2 weeks by
//        searching "mlb power rankings" for the current week (ESPN, MLB.com,
//        theScore all publish one) and replacing the list below.
const TEAM_QUALITY = {
  nfl: {
    CHI:1, LAR:2, DET:3, LAC:4, NE:5, DAL:6, CIN:7, SEA:8, MIN:9, DEN:10,
    BAL:11, HOU:12, WSH:13, TB:14, PHI:15, BUF:16, JAX:17, GB:18, IND:19, SF:20,
    CAR:21, KC:22, NYG:23, NO:24, NYJ:25, PIT:26, LV:27, ATL:28, ARI:29, TEN:30,
    MIA:31, CLE:32,
  },
  mlb: { // theScore Power Rankings, 8th edition (mid-Sept 2026) — 30 teams
    MIL:1, ATL:2, LAD:3, TB:4, NYY:5, CHC:6, PHI:7, BOS:8, CWS:9, SD:10,
    CLE:11, HOU:12, ARI:13, MIA:14, TOR:15, BAL:16, TEX:17, SEA:18, PIT:19, STL:20,
    KC:21, MIN:22, CIN:23, WSH:24, DET:25, NYM:26, SF:27, ATH:28, COL:29, LAA:30,
  },
};

// CFB conference tier — used ONLY when a team is unranked (a ranked team already
// gets a precise score from its actual rank; this fills in "how big a program is
// this" for the 100+ unranked teams, so Michigan State-unranked still reads as a
// real program while East Carolina-unranked doesn't). Based on real 2026 FBS
// conference membership (ACC/Big Ten/Big 12/SEC + Notre Dame = power; everyone
// else = g5). Barely needs updating — only if a team actually changes conference.
const CFB_POWER = new Set([
  // ACC
  'BC','CAL','CLEM','DUKE','FSU','GT','LOU','MIA','NCST','UNC','PITT','SMU','STAN','SYR','UVA','VT','WAKE',
  // Big 12
  'ARIZ','ASU','BAY','BYU','CIN','COLO','HOU','ISU','KU','KSU','OKST','TCU','TTU','UCF','UTAH','WVU',
  // Big Ten
  'ILL','IND','IOWA','MD','MICH','MSU','MINN','NEB','NW','OSU','ORE','PSU','PUR','RUTG','UCLA','USC','WASH','WIS',
  // SEC
  'ALA','ARK','AUB','FLA','UGA','UK','LSU','MISS','MSST','MIZZ','OU','SC','TENN','TEX','TXAM','VAN',
  // Independent
  'ND',
]);
const CFB_G5 = new Set([
  // American
  'ARMY','CLT','ECU','FAU','MEM','NAVY','UNT','RICE','TEM','TULN','TLSA','UAB','USF','UTSA',
  // C-USA
  'DEL','FIU','JVST','KENN','LIB','MTSU','MOST','NMSU','SHSU','WKU',
  // MAC
  'AKR','BALL','BGSU','BUFF','CMU','EMU','KENT','MOH','OHIO','SAC','TOL','UMASS','WMU',
  // Mountain West
  'AF','HAW','NEV','UNM','SJSU','UNLV','WYO','NIU','UTEP','NDSU',
  // Pac-12 (reformed 2026)
  'ORST','WSU','BSU','CSU','FRES','SDSU','TXST','USU',
  // Sun Belt
  'APP','ARST','CCU','GAST','GASO','JMU','ULL','ULM','LT','MRSH','ODU','USA','USM','TROY',
  // Independent
  'UCONN',
]);
// ---------------------------------------------------------------------------

const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/';
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
let on = load();

function load(){
  try{ const s = JSON.parse(localStorage.getItem('whatsOn.sports')); if(Array.isArray(s)&&s.length) return s; }catch(e){}
  return DEFAULT_ON.slice();
}
function save(){ try{ localStorage.setItem('whatsOn.sports', JSON.stringify(on)); }catch(e){} }

function renderChips(){
  const box = document.getElementById('chips'); box.innerHTML='';
  for(const k in SPORTS){
    const b = document.createElement('button');
    b.className = 'chip' + (on.includes(k)?' on':''); b.textContent = SPORTS[k].name;
    b.onclick = ()=>{ on = on.includes(k) ? on.filter(x=>x!==k) : [...on,k]; save(); renderChips(); refresh(); };
    box.appendChild(b);
  }
}

async function fetchEspn(path){
  try{
    const r = await fetch(ESPN + path); if(!r.ok) throw new Error(r.status); return await r.json();
  }catch(e){
    // fallback through Netlify proxy (see _redirects file)
    const r = await fetch('/espn/' + path); if(!r.ok) throw new Error(r.status); return await r.json();
  }
}
async function fetchLeague(key){
  const sp = SPORTS[key];
  const paths = [sp.path, ...(sp.extraPaths||[])];
  const results = await Promise.all(paths.map(fetchEspn));
  const seen = new Set(), events = [];
  results.forEach(r => (r.events||[]).forEach(ev => {
    if(!seen.has(ev.id)){ seen.add(ev.id); events.push(ev); }
  }));
  return { events };
}

// Playoff-percent by team abbreviation, per sport. Loaded once and cached —
// standings don't need 30-second refreshes like scores do.
// undefined = not yet attempted, null = attempted and unavailable (falls back to win% proxy).
const standingsCache = {};
async function loadStandings(key){
  const sp = SPORTS[key];
  if(!sp.standingsPath || standingsCache[key]!==undefined) return;
  try{
    const j = await fetchEspn(sp.standingsPath);
    const raw = {};
    (function walk(node){
      if(!node || typeof node!=='object') return;
      if(Array.isArray(node.entries)){
        node.entries.forEach(e=>{
          const abbr = e.team && e.team.abbreviation;
          if(!abbr) return;
          const stat = (e.stats||[]).find(s=>typeof s.name==='string' && s.name.toLowerCase().includes('playoff') && typeof s.value==='number');
          if(stat) raw[abbr] = stat.value;
        });
      }
      for(const k in node) if(k!=='entries') walk(node[k]);
    })(j);
    // Decide percent (0-100) vs fraction (0-1) once from the whole set — a single
    // value near 1 is ambiguous (1% or 100%?), but across many teams someone is
    // reliably above 1.5 if it's percent-scale.
    const vals = Object.values(raw);
    const isPercentScale = vals.some(v=>v>1.5);
    const map = {};
    for(const abbr in raw){ const v = isPercentScale ? raw[abbr]/100 : raw[abbr]; map[abbr] = clamp((v-0.5)*2,-1,1); }
    standingsCache[key] = Object.keys(map).length ? map : null;
  }catch(e){ standingsCache[key] = null; }
}

// How far along the game is, 0 to 1. Also flags overtime.
function progress(sp, st){
  const p = st.period || 0;
  if(sp.innings){
    const detail = (st.type.detail||'').toLowerCase();
    const half = detail.startsWith('end') ? 1 : (detail.startsWith('bot') || detail.startsWith('mid')) ? 0.5 : 0;
    return { f: clamp((p-1+half)/sp.innings,0,1), ot: p > sp.innings };
  }
  const m = /(\d+):?(\d*)/.exec(st.displayClock||''); const min = m ? (+m[1] + (m[2]?+m[2]/60:0)) : 0;
  if(p > sp.periods) return { f:1, ot:true };
  const inPeriod = sp.clockDown ? 1 - clamp(min/sp.len,0,1) : clamp((min - (p-1)*sp.len)/sp.len,0,1);
  return { f: clamp((p-1+inPeriod)/sp.periods,0,1), ot:false };
}

function rate(key, ev){
  const sp = SPORTS[key], c = ev.competitions[0], st = c.status, state = st.type.state;
  const home = c.competitors.find(x=>x.homeAway==='home'), away = c.competitors.find(x=>x.homeAway==='away');
  const hs = +home.score||0, as = +away.score||0, margin = Math.abs(hs-as);
  const why = [];

  // odds
  const o = (c.odds||[])[0]; let favHome=null, spread=0, ml=0;
  if(o){
    spread = Math.abs(+o.spread||0);
    if(o.homeTeamOdds && o.homeTeamOdds.favorite) favHome = true;
    else if(o.awayTeamOdds && o.awayTeamOdds.favorite) favHome = false;
    else if(o.details){ const d=/^(\w+)\s-/.exec(o.details); if(d) favHome = d[1]===home.team.abbreviation; }
    const mline = o.moneyline || {};
    const mlHome = Math.abs(+((mline.home && mline.home.close && mline.home.close.odds)) || 0);
    const mlAway = Math.abs(+((mline.away && mline.away.close && mline.away.close.odds)) || 0);
    ml = favHome===true ? mlAway : favHome===false ? mlHome : Math.max(mlHome,mlAway);
  }
  // How much of an underdog, 0..1 — a true toss-up scores ~0, a big dog scores toward 1.
  // This single number drives the whole upset bonus below; no separate threshold needed.
  const dogScale = sp.spreadBased ? clamp(spread/14, 0, 1) : clamp((ml-100)/300, 0, 1);

  // context
  let ctx = (sp.interest||0) * W.sportInterest;
  if(ev.season && ev.season.type === 3){ ctx += W.playoff; why.push('Playoffs'); }
  // ESPN tags each league's blanket out-of-market streaming package as "national"
  // on every game, which isn't meaningful — ignore those entirely.
  const IGNORE_NETS = ['MLB.TV'];
  const natSet = new Set(), locSet = new Set();
  (c.broadcasts||[]).forEach(b=>{
    const isNat = (b.market||'').toLowerCase()==='national';
    (b.names||[]).forEach(n=>{ if(!IGNORE_NETS.includes(n)) (isNat?natSet:locSet).add(n); });
  });
  if(!natSet.size && !locSet.size){
    (c.geoBroadcasts||[]).forEach(g=>{
      if(!g.media || !g.media.shortName || IGNORE_NETS.includes(g.media.shortName)) return;
      const isNat = g.market && (g.market.type||'').toLowerCase()==='national';
      (isNat?natSet:locSet).add(g.media.shortName);
    });
  }
  locSet.forEach(n=>{ if(natSet.has(n)) locSet.delete(n); });
  const nets = [...natSet, ...locSet]; // national channel first, local channels after
  const isNational = natSet.size > 0;
  if(isNational){ ctx += W.national; }
  const hour = new Date(ev.date).getHours();
  if(hour>=17 && hour<=20){ ctx += W.evening; }
  if(isNational && hour>=17) why.push('Primetime'); else if(isNational) why.push('National TV');
  const rk = x=>(x.curatedRank&&x.curatedRank.current)||99;
  if(rk(home)<=10 && rk(away)<=10){ ctx += W.rankedBoth + W.top10Showdown; why.unshift('Top 10 showdown'); }
  else if(rk(home)<26 && rk(away)<26){ ctx += W.rankedBoth; why.unshift('Ranked matchup'); }
  else if(rk(home)<=10 || rk(away)<=10){ ctx += W.top10; }

  // hand-maintained watchability list (see WATCHABILITY above)
  const wKey = [home.team.abbreviation, away.team.abbreviation].sort().join('-');
  if(WATCHABILITY[wKey]!=null){
    const wr = WATCHABILITY[wKey];
    ctx += (wr-3)/2 * W.watchability; // 3 = no effect, 5 = full boost, 1 = full penalty
    if(wr>=4) why.push('Marquee matchup');
  }

  // team-quality/brand adjustment (see TEAM_QUALITY above) — applies to every
  // game in any sport that has a list, scaled to that list's own team count
  const tq = TEAM_QUALITY[key];
  if(tq){
    const n = Object.keys(tq).length;
    const rankToScore = r => 5 - (r-1)*4/(n-1); // rank 1..n -> score 5..1
    const twHome = tq[home.team.abbreviation], twAway = tq[away.team.abbreviation];
    if(twHome!=null && twAway!=null){
      const avgScore = (rankToScore(twHome) + rankToScore(twAway)) / 2;
      ctx += (avgScore-3)/2 * W.teamWatch;
      if(avgScore>=4) why.push('Star power');
      else if(avgScore<=2) why.push('Tough watch');
    }
  }

  // Unified 0..1 "how notable are these teams" signal, reusing whichever data
  // source this sport already has (TEAM_QUALITY list, or curatedRank for
  // sports where ranking is a real concept). null = no signal exists at all
  // for this sport (NHL, WNBA, MLS, EPL) — different from a real signal that
  // happens to be low (two unranked CFB teams are genuinely informative: most
  // of 130+ teams aren't ranked, so that's not "neutral," it's "probably not
  // a marquee program"). Used below to scale the late-game boost AND as a hard
  // ceiling, so two unranked teams can't stack their way to a 10 on closeness alone.
  let quality01 = null;
  if(tq && tq[home.team.abbreviation]!=null && tq[away.team.abbreviation]!=null){
    const n = Object.keys(tq).length;
    const toQ = r => 1 - (r-1)/(n-1); // rank1 -> 1, rankN -> 0
    quality01 = (toQ(tq[home.team.abbreviation]) + toQ(tq[away.team.abbreviation])) / 2;
  } else if(sp.hasRanking){
    // Ranked teams get a precise score from their actual rank. Unranked teams
    // fall back to CFB conference tier when available (Michigan State-unranked
    // still reads as a real program; East Carolina-unranked doesn't) — or a flat
    // baseline for sports where we don't have that (CBB, for now).
    const confTier = ab => key==='cfb' ? (CFB_POWER.has(ab) ? 0.7 : CFB_G5.has(ab) ? 0.25 : 0.3) : 0.3;
    const toQ = (ab, r) => r<=25 ? 1-(r-1)/26 : confTier(ab);
    quality01 = (toQ(home.team.abbreviation, rk(home)) + toQ(away.team.abbreviation, rk(away))) / 2;
  }

  // playoff stakes: real playoff-percent from standings when we have it,
  // otherwise fall back to each team's win% (0..1, same shape either way) —
  // but the fallback is a much weaker signal, so it counts for less and never
  // claims the confident "Playoff race" / "Non-contenders" label.
  const stMap = standingsCache[key];
  const hasRealStandings = !!(stMap && stMap[home.team.abbreviation]!=null && stMap[away.team.abbreviation]!=null);
  let pHome=null, pAway=null;
  if(hasRealStandings){
    // cache stores a -1..1 value; convert back to a 0..1 "chance" for the shared math below
    pHome = stMap[home.team.abbreviation]/2 + 0.5;
    pAway = stMap[away.team.abbreviation]/2 + 0.5;
  } else {
    const winPct = x=>{
      const r = (x.records||[]).find(rr=>rr.name==='overall');
      if(!r || !r.summary) return null;
      const m = /^(\d+)-(\d+)/.exec(r.summary);
      if(!m) return null;
      const w=+m[1], l=+m[2];
      return (w+l>=20) ? w/(w+l) : null; // ignore tiny early-season samples
    };
    pHome = winPct(home); pAway = winPct(away);
  }
  if(pHome!=null && pAway!=null){
    const alive = p => p >= 0.05;                                  // below 5% counts as functionally dead
    const tension = p => clamp(1 - Math.abs(p-0.5)/0.45, 0, 1);     // peaks at a true 50/50 race, fades to 0 by ~5%/95%
    let stakes;
    if(!alive(pHome) && !alive(pAway)){ stakes = -1; if(hasRealStandings) why.push('Non-contenders'); }
    else {
      stakes = (tension(pHome)+tension(pAway))/2;
      if(hasRealStandings && stakes>=0.7) why.push('Playoff race');
    }
    ctx += stakes * (hasRealStandings ? W.standings : W.standings*0.4);
  }

  let r, comp01, drama01;
  if(state==='pre'){
    let close = 0.5;
    if(o){ close = sp.spreadBased ? clamp(1 - spread/14,0,1) : clamp(1 - (ml-100)/150,0,1); }
    r = W.preBase + W.preSpread*close + ctx;
    comp01 = close; drama01 = close; // pregame "drama" is really just anticipation from the expected closeness
    if(o && close>=0.8) why.unshift('Pick-em'); 
    else if(o && close<=0.25) why.unshift('Heavy favorite');
  } else if(state==='in'){
    const {f, ot} = progress(sp, st);
    const close = clamp(1 - margin/(sp.unit*3),0,1);
    // Smoothly interpolated between the checkpoints in W — see comment up there.
    // The late-game portion (past the midpoint) is scaled by quality, so the
    // full escalation is reserved for genuinely notable teams, not any tied game.
    const qForMult = quality01 ?? 0.5; // neutral only when this sport has no signal at all
    const scaledLate = W.timeMid + (W.timeLate-W.timeMid)*qForMult;
    const scaledEnd  = W.timeMid + (W.timeEnd -W.timeMid)*qForMult;
    const scaledOT   = W.timeMid + (W.timeOT  -W.timeMid)*qForMult;
    const timeMult = ot ? scaledOT
      : f<=0.5  ? W.timeStart + (W.timeMid-W.timeStart)*(f/0.5)
      : f<=0.75 ? W.timeMid   + (scaledLate-W.timeMid)*((f-0.5)/0.25)
      :           scaledLate  + (scaledEnd-scaledLate)*((f-0.75)/0.25);
    r = W.liveBase + W.liveClose*close*timeMult;
    if(ot){ r += W.otBonus; why.unshift(sp.innings?'Extra innings':'Overtime'); }
    else if(f>=0.75 && margin<=sp.unit){ r += W.wireBonus; why.unshift('Down to the wire'); }
    else if(margin<=sp.unit){ why.unshift('One-score game'); }
    else if(close===0){ why.unshift('Blowout'); }
    const dogLeads = favHome!==null && margin>0 && ((favHome && as>hs) || (!favHome && hs>as));
    if(dogLeads){ r += W.upsetBonus*dogScale; if(dogScale>=0.3) why.unshift('Upset brewing'); }
    // a ranked team trailing is newsworthy on its own — separate from the odds-based
    // upset bonus above, since a team's ranking and its betting line don't always agree.
    // Scaled by how highly ranked (rank 1 = full weight) AND by how close the game
    // still is, so a ranked team down 40 in garbage time doesn't get an inflated boost.
    // "Can they still finish the upset" — wider margin tolerance than the base
    // closeness measure (a 2-score deficit still counts as real appointment
    // viewing for an upset-in-progress), and weighted MORE as the game gets
    // later, not less — that's specifically when people tune in to see if it
    // actually gets finished off.
    // a ranked team in a genuinely close game is upset tension either way — whether
    // they're trailing (could lose outright) or clinging to a one-score lead (the
    // underdog could still complete it). Separate from the odds-based upset bonus
    // above, since a team's ranking and its betting line don't always agree.
    // "Can the underdog still finish it" — wider margin tolerance than the base
    // closeness measure (a 2-score game still counts as real appointment viewing),
    // and weighted MORE as the game gets later, not less — that's specifically
    // when people tune in to see if it actually gets finished off.
    const rankScale = rv => rv<=25 ? (26-rv)/25 : 0;
    const bestRankScale = Math.max(rankScale(rk(home)), rankScale(rk(away)));
    const catchable = clamp(1 - margin/(sp.unit*5), 0, 1);
    const upsetTension = bestRankScale * catchable * (0.4 + 0.6*f);
    if(upsetTension>0){ r += W.rankedTrailing*upsetTension; if(upsetTension>=0.15) why.unshift('Upset alert'); }
    r += ctx;
    comp01 = close;
    // Drama uses the SAME late-game curve but without the quality scaling —
    // urgency is urgency regardless of who's playing; that's Stakes' job.
    const dramaTimeMult = ot ? W.timeOT
      : f<=0.5  ? W.timeStart + (W.timeMid-W.timeStart)*(f/0.5)
      : f<=0.75 ? W.timeMid   + (W.timeLate-W.timeMid)*((f-0.5)/0.25)
      :           W.timeLate  + (W.timeEnd-W.timeLate)*((f-0.75)/0.25);
    let dramaRaw = clamp(close * (dramaTimeMult-W.timeStart)/(W.timeOT-W.timeStart), 0, 1);
    if(ot) dramaRaw = Math.max(dramaRaw, 0.9);
    if(f>=0.75 && margin<=sp.unit) dramaRaw = Math.max(dramaRaw, 0.7);
    if(dogScale>=0.3) dramaRaw = Math.max(dramaRaw, 0.5+dogScale*0.4);
    if(upsetTension>=0.15) dramaRaw = Math.max(dramaRaw, 0.5+upsetTension*0.4);
    drama01 = clamp(dramaRaw, 0, 1);
  } else {
    const {ot} = progress(sp, st);
    const close = clamp(1 - margin/(sp.unit*3),0,1);
    const dogWon = favHome!==null && margin>0 && ((favHome && as>hs) || (!favHome && hs>as));
    r = W.finalBase + W.finalClose*close + (ot?W.finalOT:0) + (dogWon?W.finalUpset*dogScale:0) + ctx*W.finalContext;
    comp01 = close;
    let dramaRaw = close;
    if(ot) dramaRaw = Math.max(dramaRaw, 0.9);
    if(dogWon && dogScale>=0.3) dramaRaw = Math.max(dramaRaw, 0.5+dogScale*0.4);
    drama01 = clamp(dramaRaw, 0, 1);
    if(ot) why.unshift(sp.innings?'Extra innings':'Overtime');
    if(dogWon && dogScale>=0.3) why.unshift('Upset');
    else if(margin<=sp.unit) why.unshift('Close finish');
  }
  // Soft ceiling: below W.softCeiling, nothing changes. Above it, each extra
  // point of raw excitement buys progressively less displayed rating, so
  // stacking several boosts at once (great teams + national TV + tied + late)
  // pushes toward 10 without casually reaching it — an exact 10.0 stays rare,
  // and games that would've all flatly clamped to "10" stay distinguishable.
  const T = W.softCeiling, k = W.softCeilingSoftness;
  const shown = r<=T ? r : T + (10-T)*(1-Math.exp(-(r-T)/k));
  // Hard ceiling tied to team quality — only when a REAL signal exists (see
  // quality01 above). Two unranked teams (quality01 ~0.3) cap around 7.2, no
  // matter how close or late the game gets; a genuine marquee matchup
  // (quality01 ~1.0) isn't capped below 10 at all.
  const qCap = quality01!=null ? (W.qualityCapBase + W.qualityCapRange*quality01) : 10;
  // Stakes: everything about why this matchup matters, independent of the
  // current score — reuses ctx directly, since that's exactly what ctx already
  // is (sport interest, playoff, national TV, ranked/watchability, team quality,
  // standings). Normalized against a realistic ctx range, not the full
  // mathematical extreme, so a genuinely stakes-heavy game reaches the top.
  const stakes01 = clamp((ctx - W.stakesFloor) / W.stakesRange, 0, 1);
  return { r: clamp(Math.round(Math.min(shown,qCap)*10)/10,1,10),
    comp: Math.round(comp01*100)/10, drama: Math.round(drama01*100)/10, stakes: Math.round(stakes01*100)/10,
    state, home, away, hs, as, st, nets, isNational, why: why.slice(0,3), ev, key };
}

function cls(r){ return r>=8.5?'r-hot':r>=7?'r-warm':r>=5?'r-mild':'r-cool'; }
function team(t, score, lead, state){
  const rk = t.curatedRank&&t.curatedRank.current<26 ? `<span class="rank">${t.curatedRank.current}</span>` : '';
  const s = state==='pre' ? '' : ` ${score}`;
  return `<span class="${lead?'lead':'trail'}">${rk}${t.team.abbreviation}${s}</span>`;
}
function statusText(g){
  const d = new Date(g.ev.date);
  if(g.state==='pre') return d.toLocaleDateString([], {weekday:'short'}) + ' ' + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  return `<b>${g.st.type.shortDetail}</b>`;
}
function card(g){
  const label = g.state==='pre' ? 'upcoming' : g.state==='in' ? 'live' : 'final';
  const netLines = g.nets.map((n,i)=>`<div class="${i===0 && g.isNational?'net-nat':'net-loc'}">${n}</div>`).join('');
  const isOpen = expandedGames.has(g.ev.id);
  const sub = (label,val) => `<div class="subscore"><span>${label}</span><b>${val.toFixed(1)}</b></div>`;
  return `<div class="game ${g.state}${isOpen?' expanded':''}" data-id="${g.ev.id}">
    <div class="rating ${cls(g.r)}">${g.r.toFixed(1)}<small>${SPORTS[g.key].name}</small></div>
    <div>
      <div class="teams">${team(g.away,g.as,g.as>=g.hs,g.state)}${team(g.home,g.hs,g.hs>=g.as,g.state)}</div>
      <div class="status">${statusText(g)}</div>
      ${netLines?`<div class="nets">${netLines}</div>`:''}
      ${g.why.length?`<div class="why">${g.why.join(', ')}<span class="chevron">${isOpen?'▲':'▼'}</span></div>`:`<div class="why">&nbsp;<span class="chevron">${isOpen?'▲':'▼'}</span></div>`}
      <div class="breakdown">${sub('Competitiveness',g.comp)}${sub('Importance',g.stakes)}${sub('Drama',g.drama)}</div>
    </div></div>`;
}

let timer=null;
let lastGames = [];
const expandedGames = new Set(); // game ids currently showing their breakdown — survives refreshes

function renderList(games){
  const list = document.getElementById('list');
  const errs = games.filter(g=>g.err).map(g=>SPORTS[g.err].name);
  const by = s=>games.filter(g=>!g.err&&g.state===s).sort((a,b)=>b.r-a.r);
  let html='';
  const sec=(title,arr)=>{ if(arr.length) html += `<h2>${title}</h2>` + arr.map(card).join(''); };

  sec('Live now', by('in'));

  const dayKey = d => d.toDateString(); // local calendar day
  const dayLabel = d => {
    const today = new Date(), tmrw = new Date(); tmrw.setDate(today.getDate()+1);
    if(dayKey(d)===dayKey(today)) return 'Today';
    if(dayKey(d)===dayKey(tmrw)) return 'Tomorrow';
    return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
  };
  const upcoming = by('pre');
  if(upcoming.length){
    html += '<h2>Coming up</h2>';
    const groups = new Map(); // dayKey -> {date, games}
    upcoming.forEach(g=>{
      const d = new Date(g.ev.date);
      const k = dayKey(d);
      if(!groups.has(k)) groups.set(k, {date:d, games:[]});
      groups.get(k).games.push(g);
    });
    [...groups.values()].sort((a,b)=>a.date-b.date).forEach(({date, games})=>{
      html += `<h3 class="day">${dayLabel(date)}</h3>` + games.map(card).join('');
    });
  }

  sec('Final', by('post'));
  if(errs.length) html += `<div class="err">Couldn't load ${errs.join(', ')}. Try again in a minute.</div>`;
  if(!html) html = '<div class="empty">No games today for the sports you picked.</div>';
  list.innerHTML = html;
  document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
}

async function refresh(){
  const list = document.getElementById('list');
  if(!on.length){ list.innerHTML='<div class="empty">Pick a sport above to see what\'s worth watching.</div>'; return; }
  on.forEach(k=>{ loadStandings(k); }); // fire-and-forget, cached after first success/failure
  const results = await Promise.all(on.map(async k=>{
    try{ const j = await fetchLeague(k); return (j.events||[]).map(ev=>rate(k,ev)); }
    catch(e){ return [{err:k}]; }
  }));
  lastGames = results.flat();
  renderList(lastGames);
}
document.getElementById('list').addEventListener('click', e=>{
  const el = e.target.closest('.game[data-id]');
  if(!el) return;
  const id = el.dataset.id;
  if(expandedGames.has(id)) expandedGames.delete(id); else expandedGames.add(id);
  renderList(lastGames);
});
function schedule(){ clearInterval(timer); if(!document.hidden){ refresh(); timer=setInterval(refresh,30000); } }
document.addEventListener('visibilitychange', schedule);
renderChips(); schedule();
</script>
